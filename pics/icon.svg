<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- 蓝色渐变 -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC"/>
      <stop offset="100%" style="stop-color:#004C98"/>
    </linearGradient>
    <!-- 齿轮阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景：圆角矩形 -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="url(#blueGradient)"/>

  <!-- 文档图标 (左侧) -->
  <g transform="translate(40, 40)">
    <!-- 文档主体 -->
    <rect x="0" y="0" width="80" height="100" rx="8" fill="white" opacity="0.95"/>
    <!-- 文档折角 -->
    <path d="M 60 0 L 80 20 L 60 20 Z" fill="#004C98" opacity="0.3"/>
    <!-- 文档线条 -->
    <rect x="15" y="30" width="50" height="6" rx="2" fill="#004C98" opacity="0.5"/>
    <rect x="15" y="45" width="40" height="6" rx="2" fill="#004C98" opacity="0.5"/>
    <rect x="15" y="60" width="45" height="6" rx="2" fill="#004C98" opacity="0.5"/>
    <rect x="15" y="75" width="35" height="6" rx="2" fill="#004C98" opacity="0.5"/>
  </g>

  <!-- 齿轮图标 (右下) -->
  <g transform="translate(130, 130)" filter="url(#shadow)">
    <!-- 齿轮主体 -->
    <circle cx="50" cy="50" r="45" fill="white" opacity="0.95"/>
    <!-- 齿轮内圆 -->
    <circle cx="50" cy="50" r="20" fill="#004C98"/>
    <!-- 齿轮齿 -->
    <g fill="white">
      <!-- 上 -->
      <rect x="40" y="0" width="20" height="15" rx="3"/>
      <!-- 下 -->
      <rect x="40" y="85" width="20" height="15" rx="3"/>
      <!-- 左 -->
      <rect x="0" y="40" width="15" height="20" rx="3"/>
      <!-- 右 -->
      <rect x="85" y="40" width="15" height="20" rx="3"/>
      <!-- 左上 -->
      <rect x="8" y="8" width="15" height="15" rx="3" transform="rotate(45, 15, 15)"/>
      <!-- 右上 -->
      <rect x="77" y="8" width="15" height="15" rx="3" transform="rotate(-45, 85, 15)"/>
      <!-- 左下 -->
      <rect x="8" y="77" width="15" height="15" rx="3" transform="rotate(-45, 15, 85)"/>
      <!-- 右下 -->
      <rect x="77" y="77" width="15" height="15" rx="3" transform="rotate(45, 85, 85)"/>
    </g>
  </g>

  <!-- 连接元素：小圆点 -->
  <circle cx="100" cy="100" r="8" fill="#0066CC"/>
  <circle cx="120" cy="90" r="5" fill="#004C98" opacity="0.7"/>
</svg>